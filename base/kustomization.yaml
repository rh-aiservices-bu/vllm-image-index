apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- serviceaccount.yaml
- rbac.yaml
- deployment.yaml
- service.yaml
- route.yaml
- cronjob.yaml

# nginx configuration only — vllm-image-data ConfigMap is generated in the root
# kustomization.yaml (where app/index.html is accessible)
configMapGenerator:
- name: vllm-nginx-conf
  options:
    disableNameSuffixHash: true
  files:
  - nginx.conf
