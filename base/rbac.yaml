apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vllm-fetch
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["vllm-image-data"]
  verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vllm-fetch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vllm-fetch
subjects:
- kind: ServiceAccount
  name: vllm-fetch
