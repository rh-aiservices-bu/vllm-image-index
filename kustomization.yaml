apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vllm-image-index

resources:
- base/

# vllm-image-data is intentionally NOT managed here — it is created and patched
# exclusively by the CronJob via the Kubernetes API. Managing it via kustomize
# would reset data.json to {} on every deploy.
configMapGenerator:
- name: vllm-index-html
  options:
    disableNameSuffixHash: true
  files:
  - index.html=app/index.html
